<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Container Tracking</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>
<body>
  <main class="page">
    <h1>Container Tracking</h1>
    <p class="subtitle">Track a container directly from the carrier's own tracking system.</p>

    <form id="track-form" class="track-form">
      <label for="line">Shipping line</label>
      <select id="line" name="line" required>
        {% for code, name in lines.items() %}
          <option value="{{ code }}">{{ name }}</option>
        {% endfor %}
      </select>

      <label for="container">Container number</label>
      <input id="container" name="container" type="text" placeholder="e.g. HLXU1234561" autocomplete="off" required>

      <button type="submit" id="submit-btn">Track</button>
    </form>

    <div id="status" class="status" hidden></div>
    <div id="result" class="result" hidden></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
