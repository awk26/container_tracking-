<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Container Tracking</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet.css') }}">
</head>
<body>
  <main class="page">
    <h1>Container Tracking</h1>
    <p class="subtitle">Track a container directly from the carrier's own tracking system.</p>

    <form id="track-form" class="track-form">
      <label for="line">Shipping line</label>
      <select id="line" name="line" required>
        {% for code, name in lines.items() %}
          <option value="{{ code }}">{{ name }}</option>
        {% endfor %}
      </select>

      <label for="container" id="container-label">Container number</label>
      <input id="container" name="container" type="text" placeholder="e.g. HLXU1234561" autocomplete="off">

      <label for="samudera-search-type" id="search-type-label" hidden>Search type</label>
      <select id="samudera-search-type" hidden>
        <option value="bl_container">BL &amp; Container Number</option>
        <option value="bl">BL Number</option>
      </select>

      <button type="submit" id="submit-btn">Track</button>

      <div id="samudera-fields" class="samudera-fields" hidden>
        <div class="field">
          <label for="bl-number">BL number</label>
          <input id="bl-number" type="text" placeholder="e.g. SSLSGGTICAE5221" autocomplete="off">
        </div>
        <div class="field" id="samudera-container-field">
          <label for="samudera-container">Container number</label>
          <input id="samudera-container" type="text" placeholder="e.g. SIKU3035784" autocomplete="off">
        </div>
      </div>
    </form>

    <div id="status" class="status" hidden></div>
    <div id="result" class="result" hidden></div>
  </main>

  <script src="{{ url_for('static', filename='vendor/leaflet.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
